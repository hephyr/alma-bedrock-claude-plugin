name: Build & Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6.2.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Prepare release artifacts
        run: |
          mkdir -p /tmp/release
          cp -r dist         /tmp/release/dist
          cp manifest.json   /tmp/release/manifest.json
          cp package.json    /tmp/release/package.json
          cp README.md       /tmp/release/README.md
          [ -f LICENSE ] && cp LICENSE /tmp/release/LICENSE || true

      - name: Deploy to release branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: /tmp/release
          force_orphan: true
          commit_message: 'chore: release build from ${{ github.sha }}'
